[[item]]
id = "redis"
name = "Redis"
category = "database"
source = "online"
kind = "portable"
archive = "zip"
provider = { kind = "github_release", repo = "redis-windows/redis-windows", asset = "Redis-{version}-Windows-x64-cygwin-with-Service.zip", prefer = "latest" }
detect = { command = ["redis-server", "--version"] }
env = { path_append = ["{install_dir}"] }
verify = [["{install_dir}\\redis-cli.exe", "--version"]]
note = "官方无 Windows 版，取自社区仓库；解压投放，不注册 Windows 服务"

[[item]]
id = "mongodb"
name = "MongoDB"
category = "database"
source = "online"
kind = "portable"
archive = "zip"
provider = { kind = "mongodb_fastdl", prefer = "latest" }
detect = { command = ["mongod", "--version"] }
env = { path_append = ["{install_dir}\\bin"] }
verify = [["{install_dir}\\bin\\mongod.exe", "--version"]]
note = "免安装社区版（各版本线的当前生产版），压缩包约 750MB；解压后不注册 Windows 服务，需要时用 mongod 手动启动"

# ------------------------- Web 服务 -------------------------
[[item]]
id = "nginx"
name = "nginx"
category = "web"
source = "online"
kind = "portable"
archive = "zip"
provider = { kind = "nginx_official", prefer = "lts" }
detect = { command = ["nginx", "-v"] }
env = { path_append = ["{install_dir}"] }
verify = [["{install_dir}\\nginx.exe", "-v"]]
note = "免安装版，解压即用；偶数版本号是稳定线（默认推荐），奇数是主线版"

[[item]]
id = "apache"
name = "Apache HTTP Server"
category = "web"
source = "online"
kind = "portable"
archive = "zip"
provider = { kind = "apache_lounge", prefer = "latest" }
detect = { command = ["httpd", "-v"] }
env = { path_append = ["{install_dir}\\Apache24\\bin"] }
verify = [["{install_dir}\\Apache24\\bin\\httpd.exe", "-v"]]
note = "Windows 官方不分发二进制，取自官方推荐的 Apache Lounge 构建；解压后主程序在 Apache24 子目录，需先装好 VC++ 运行库（见运行库分类）"

# ------------------------- 运行库 -------------------------
[[item]]
id = "vcredist"
name = "VC++ 运行库 2015-2022"
category = "vcredist"
source = "online"
kind = "installer"
provider = { kind = "fixed", urls = [
  "https://aka.ms/vs/17/release/vc_redist.x64.exe",
  "https://aka.ms/vs/17/release/vc_redist.x86.exe"
] }
detect = { registry_display_name_prefix = "Microsoft Visual C++ 2015-2022 Redistributable", path = "C:\\Windows\\System32\\msvcp140.dll" }

# ------------------------- IDE -------------------------
[[item]]
id = "vs2022"
name = "Visual Studio 2022"
category = "ide"
source = "online"
kind = "installer"
provider = { kind = "fixed", urls = ["https://aka.ms/vs/17/release/vs_community.exe"] }
detect = { path = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\Common7\\IDE\\devenv.exe" }
note = "引导程序需联网下载数 GB 组件；安装时请勾选「使用 C++ 的桌面开发」"

