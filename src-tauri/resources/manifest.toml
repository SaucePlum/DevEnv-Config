# ============================================================
# 开发环境快速配置助手 · 软件清单
# 字段说明见设计文档第 8 节
# ============================================================

# ------------------------- 运行环境 -------------------------
[[item]]
id = "node"
name = "Node.js"
category = "runtime"
source = "online"
kind = "installer"
provider = { kind = "node_dist", prefer = "lts" }
detect = { command = ["node", "--version"] }
note = "MSI 会自动写入系统 PATH"

[[item]]
id = "python"
name = "Python"
category = "runtime"
source = "online"
kind = "installer"
provider = { kind = "python_ftp", prefer = "latest" }
detect = { command = ["python", "--version"] }
note = "安装向导需勾选 Add python.exe to PATH"

[[item]]
id = "rust"
name = "Rust"
category = "runtime"
source = "online"
kind = "installer"
provider = { kind = "rustup", url = "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe", mirror = "https://rsproxy.cn/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" }
detect = { command = ["rustc", "--version"] }
note = "安装后由 rustup 管理，默认工具链 stable"

[[item]]
id = "go"
name = "Go"
category = "runtime"
source = "online"
kind = "installer"
provider = { kind = "go_dl", prefer = "latest" }
detect = { command = ["go", "version"] }
env = { path_append = ["C:\\Program Files\\Go\\bin"] }
note = "版本列表只显示正式版；安装包默认装到 C:\\Program Files\\Go 并由安装器写入 PATH"

[[item]]
id = "dotnet"
name = ".NET SDK"
category = "runtime"
source = "online"
kind = "installer"
provider = { kind = "dotnet_release", prefer = "lts" }
detect = { command = ["dotnet", "--version"] }
env = { path_append = ["C:\\Program Files\\dotnet"] }
note = "只列出仍在支持期内的版本线；安装包会自动写入 PATH，未生效时由工具兜底追加"

[[item]]
id = "java"
name = "Java (OpenJDK)"
category = "runtime"
source = "online"
kind = "portable"
archive = "zip"
provider = { kind = "adoptium", prefer = "lts" }
detect = { command = ["java", "-version"] }
env = { set = { JAVA_HOME = "{install_dir}" }, path_append = ["{install_dir}\\bin"] }
verify = [["{install_dir}\\bin\\java.exe", "-version"]]
note = "免安装版（Eclipse Temurin JDK），解压即用；请选择安装目录，工具会自动设置 JAVA_HOME 并加入 PATH"

[[item]]
id = "ruby"
name = "Ruby"
category = "runtime"
source = "online"
kind = "installer"
provider = { kind = "github_release", repo = "oneclick/rubyinstaller2", asset = "rubyinstaller-{version}-x64.exe", prefer = "latest" }
detect = { command = ["ruby", "--version"] }
note = "版本列表来自 RubyInstaller 官方发布；安装向导请勾选「Add Ruby executables to your PATH」"

[[item]]
id = "php"
name = "PHP"
category = "runtime"
source = "online"
kind = "portable"
archive = "zip"
provider = { kind = "php_windows", prefer = "latest" }
detect = { command = ["php", "--version"] }
env = { path_append = ["{install_dir}"] }
verify = [["{install_dir}\\php.exe", "--version"]]
note = "免安装包（线程安全版 x64），解压即用；请选择安装目录，工具会自动把目录加入 PATH。windows.php.net 无国内镜像，仅官网单一来源"

[[item]]
id = "miniconda"
name = "Miniconda"
category = "runtime"
source = "online"
kind = "installer"
provider = { kind = "miniconda", prefer = "latest" }
detect = { command = ["conda", "--version"] }
env = { path_append = ["%USERPROFILE%\\miniconda3", "%USERPROFILE%\\miniconda3\\Scripts"] }
note = "Anaconda 官方精简版；向导默认装到 %USERPROFILE%\\miniconda3，若未勾选加入 PATH 则由工具兜底追加"

[[item]]
id = "bun"
name = "Bun"
category = "runtime"
source = "online"
kind = "portable"
archive = "zip"
provider = { kind = "bun", prefer = "latest" }
detect = { command = ["bun", "--version"] }
env = { set = { BUN_INSTALL = "{install_dir}" }, path_append = ["{install_dir}"] }
verify = [["{install_dir}\\bun.exe", "--version"]]
note = "免安装版，解压即用；请选择安装目录，工具会自动设置 BUN_INSTALL 并加入 PATH"

# ------------------------- 编译工具链 -------------------------
[[item]]
id = "git"
name = "Git"
category = "build"
source = "online"
kind = "installer"
provider = { kind = "github_release", repo = "git-for-windows/git", asset = "Git-{version}-64-bit.exe", mirror = "https://registry.npmmirror.com/-/binary/git-for-windows/{tag}/Git-{version}-64-bit.exe", prefer = "latest" }
detect = { command = ["git", "--version"] }

[[item]]
id = "cmake"
name = "CMake"
category = "build"
source = "local"
kind = "installer"
path = "build/cmake/cmake-4.4.3-windows-x86_64.msi"
detect = { command = ["cmake", "--version"] }
env = { path_append = ["C:\\Program Files\\CMake\\bin"] }
note = "内置安装包；向导可勾选加入 PATH，未勾选则自动追加"

# ------------------------- 数据库 -------------------------
[[item]]
id = "mariadb"
name = "MariaDB"
category = "database"
source = "online"
kind = "installer"
provider = { kind = "mariadb_rest", prefer = "latest" }
detect = { registry_display_name_prefix = "MariaDB" }
env = { path_append = ["C:\\Program Files\\MariaDB 12.3\\bin"] }
note = "安装时请设置 root 密码；完成后自动把 bin 目录加入 PATH"

